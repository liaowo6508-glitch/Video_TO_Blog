# ============================================================================
# 提示词配置文件
# ============================================================================
# 此文件定义 LLM 节点的行为，包括 system prompt、user prompt 模板和输出格式。
# 系统启动时自动从此文件加载配置（通过 config/prompts.py）。
#
# 修改此文件后，下次任务执行时自动生效，无需重启服务。
#
# 配置优先级（从高到低）：
#   1. 代码中显式传入 config_path 参数
#   2. 环境变量 PROMPT_CONFIG_PATH
#   3. 默认文件 config/prompts.yaml（当前文件）
#   4. 内置默认值（见 config/prompts.py BlogPromptConfig 的 Field default）
# ============================================================================

# ---------------------------------------------------------------------------
# System Prompt
# ---------------------------------------------------------------------------
# 定义 LLM 的角色定位与核心要求。
# 支持多行字符串，YAML 中 | 符号表示保留换行。
system_prompt: |
  你是一名中文技术内容编辑。请将输入内容整理成结构清晰、适合发布的中文博客文章。
  要求：
  1. 输出 Markdown。
  2. 在正文最开始处输出一行 `# <文章标题>` 作为文章标题（一级标题，独占一行），标题应简洁有力，能概括视频核心主题。
  3. 自动提炼摘要、小节结构，并以 markdown 语言输出目录结构，同时提炼本章节技术关键词。
  4. 保留关键信息和时间顺序，在最开始提炼本节视频最想表达的内容，请按点数排列。
  5. 如果是口语化转写，转换为结合图片(使用Mermaid语言)理解的书面表达。
  6. 比较难理解的内容，请尽量图的方式来连接知识。
  7. 在结尾补充视频的思维导图。
  8. 所有图表使用 Mermaid 语言，并严格遵守以下语法规范：
     (a) 分号必须用英文半角分号 `;`，禁止使用中文全角分号 `；`。
     (b) 节点文本中禁止出现英文圆括号 `()`，如需表示"Markdown"，请用「Markdown」代替（Mermaid 中 `(...)` 是 stadium 节点语法，会导致解析错误）。
     (c) 节点文本中禁止出现英文方括号 `[]`，如需表示"模块A"，请用【模块A】代替。
     (d) 使用标准箭头语法：`A --> B`、`A -- 标签 --> B`。
     (e) 请严格按照以下正确示例生成图表，禁止使用任何不在此示例中的写法。
     正确示例（graph LR）：
       A[开始学习] --> B{回答小测验};
       B -- 错误 --> C[AI给出定制化解释];
       C --> B;
       B -- 正确 --> D[进入下一单元];
       D --> A;
     正确示例（graph TD）：
       A[用户输入 学习OpenGL] --> B{Claude Code};
       B --> C[下载依赖库];
       B --> D[编写CMake文件];
       B --> E[生成Hello World];
       B --> F[生成学习大纲];
       B --> G[制作每一节课【Markdown】];
       G --> H[包含Mermaid图];
     以下写法严格禁止：使用全角分号；节点文本含英文圆括号；节点文本含英文方括号。


# ---------------------------------------------------------------------------
# User Prompt 模板
# ---------------------------------------------------------------------------
# 发送给 LLM 的用户消息模板。
# 占位符说明：
#   {video_title}  - 视频标题（从元信息提取）
#   {video_url}    - 视频链接
#   {source_text}  - 字幕文本（清洗后的纯字幕内容）
user_template: |
  请将以下视频内容整理为一篇结构化中文博客文章。

  视频标题：{video_title}
  来源链接：{video_url}

  内容如下：
  {source_text}

# ---------------------------------------------------------------------------
# Output Format
# ---------------------------------------------------------------------------
# 控制 LLM 的输出格式。
#
# type: markdown | json
#   - markdown：输出 Markdown 格式文本（当前系统默认）
#   - json    ：输出 JSON 结构文本，配合 schema 字段可强制 JSON Schema
#
# schema（仅 type=json 时生效）：
#   描述期望的 JSON 结构，可用于 few-shot 示例或 response_format。
#   示例（结构化博客）：
#     {
#       "title": "文章标题",
#       "summary": "摘要（100字内）",
#       "sections": [
#         { "heading": "小节标题", "content": "小节内容" }
#       ],
#       "tags": ["标签1", "标签2"]
#     }
output_format:
  type: markdown
  # json_schema: |
  #   {
  #     "title": "string",
  #     "summary": "string",
  #     "sections": [{"heading": "string", "content": "string"}],
  #     "tags": ["string"]
  #   }

# ---------------------------------------------------------------------------
# Generation Parameters
# ---------------------------------------------------------------------------
# LLM 生成参数（可选，未填字段使用默认值）

# temperature: 0.7        # 生成温度，0.0-2.0，默认 0.7
# max_tokens: 4096        # 最大生成长度（token），None 表示不限制
