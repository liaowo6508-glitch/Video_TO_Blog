# ============================================================
# 视频转博客 配置文件
# 用记事本直接修改，保存为 UTF-8 即可。
# ============================================================

[bilibili]
# B站登录 cookie
# 浏览器 F12 -> Application -> Cookies -> https://www.bilibili.com -> SESSDATA
sessdata =

# 可选：浏览器导出的 Netscape 格式 cookies.txt 路径，优先级高于 sessdata
cookie_file =

# B站返回 412 时可改为 true
no_proxy = false


[deepseek]
# https://platform.deepseek.com/ 申请
api_key =

# deepseek-chat（快、便宜）/ deepseek-reasoner（推理更强）
model = deepseek-chat

base_url = https://api.deepseek.com


[run]
# video_to_blog：生成博客 + 清洗后字幕
# subtitle_only：只保存清洗后字幕
pipeline = video_to_blog

# 提示词文件
prompt_config = prompts.yaml
